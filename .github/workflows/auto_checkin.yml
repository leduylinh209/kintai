name: Auto Clock In & Out (Japan Time)

on:
  schedule:
    - cron: "40 22 * * *"  # 08:30 JST
    - cron: "30 7 * * *"   # 18:10 JST
  workflow_dispatch:

jobs:
  check-in-out:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: "3.9"

      - name: Print current time (UTC + JST)
        run: |
          echo "🕒 Current UTC: $(date -u)"
          TZ=Asia/Tokyo date

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests jpholiday pytz

      - name: Run Auto Clock In/Out
        run: python kintai.py
